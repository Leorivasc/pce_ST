<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCE_ST</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2d323b; --text: #e6e8ec; --muted: #98a0ad;
    --accent: #7cc4ff; --danger: #ff8d8d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f3f5; --panel: #ffffff; --line: #d5d8de; --text: #1c1f24; --muted: #5d6572; --accent: #0b6bcb; --danger: #b3261e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 32px; }
  h1 { font-size: 16px; margin: 4px 0 10px; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button, select, label.file {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  label.file input { display: none; }
  #screenwrap { background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; outline: none; background: #000; }
  canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  #status { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hint { margin-top: 4px; color: var(--muted); font-size: 13px; }
  #error { color: var(--danger); margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>PCE_ST — Atari ST (step 1 skeleton)</h1>
  <div class="bar">
    <button id="start" class="primary">Start</button>
    <button id="pause" disabled>Pause</button>
    <button id="reset" disabled>Reset</button>
    <label>Speed
      <select id="speed">
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="0">Maximum</option>
      </select>
    </label>
    <label>Monitor
      <select id="monitor">
        <option value="mono" selected>Monochrome 640×400</option>
        <option value="color">Color 320×200</option>
      </select>
    </label>
    <label class="file">Mount in A: <input id="mount" type="file" accept=".st"></label>
    <button id="save" disabled>Save A:</button>
  </div>
  <div id="screenwrap"><canvas id="screen" tabindex="0"></canvas></div>
  <div id="status">Not started.</div>
  <div id="hint">Click the screen to capture the mouse (Esc releases it). The keyboard is active while the screen has focus.
    Help = End, Undo = Page Down.</div>
  <div id="error"></div>
</main>
<script src="keymap.js"></script>
<script src="main.js"></script>
</body>
</html>
